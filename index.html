
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101322">
<title>A Little Something For You</title>
<style>
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101322;
}
canvas {
  display:block;
  width:100%;
  height:100%;
  touch-action:manipulation;
}
.title {
  position:fixed;
  top:6%;
  width:100%;
  text-align:center;
  color:#fff0ed;
  font:italic clamp(23px,5vw,38px) Georgia,serif;
  letter-spacing:1.4px;
  text-shadow:0 0 30px #e9a9c077;
  opacity:0;
  animation:fade 3s 2s forwards;
  pointer-events:none;
}
.subtitle {
  position:fixed;
  bottom:3%;
  width:100%;
  text-align:center;
  color:#cbb9c9;
  font:12px Georgia,serif;
  letter-spacing:1.2px;
  opacity:0;
  animation:fade 2s 6s forwards;
  pointer-events:none;
}
@keyframes fade { to {opacity:1;} }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="title">some flowers for you :)</div>
<div class="subtitle">tap anywhere to make a wish</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{
  t=clamp(t,0,1);
  return t*t*(3-2*t);
};

let W,H,D,S,cx,cy;
let start=performance.now(),last=0;
let stars=[],fireflies=[],particles=[],meteors=[];

const palettes={
  blush:["#fff0f4","#f6b9d0","#e487ab","#b95c83"],
  rose:["#ffe2ec","#ef9cba","#d76c96","#a94c73"],
  mauve:["#f3e4f1","#d6b1d2","#b784b7","#8e5c91"],
  lavender:["#f2eaff","#d4bff3","#ac91db","#7c65b5"],
  ivory:["#fffef9","#f8eee3","#e9d5c5","#c7aa96"],
  peach:["#fff0e5","#f8c9b4","#e9a28e","#bc766f"],
  blue:["#eaf1ff","#c6d7f5","#9bb8e4","#718fc5"]
};

const flowers=[
  {t:"peony",x:-100,y:-235,s:30,c:"blush",d:.2},
  {t:"rose",x:-150,y:-190,s:25,c:"peach",d:.45},
  {t:"tulip",x:-130,y:-315,s:25,c:"lavender",d:.7},
  {t:"anemone",x:-65,y:-345,s:24,c:"ivory",d:.95},
  {t:"peony",x:5,y:-285,s:34,c:"rose",d:1.2},
  {t:"ranunculus",x:95,y:-330,s:27,c:"mauve",d:1.45},
  {t:"tulip",x:155,y:-265,s:25,c:"blush",d:1.7},
  {t:"anemone",x:165,y:-190,s:23,c:"ivory",d:1.95},
  {t:"rose",x:105,y:-230,s:27,c:"blush",d:2.2},
  {t:"peony",x:-40,y:-200,s:30,c:"mauve",d:2.45},
  {t:"ranunculus",x:25,y:-160,s:29,c:"blush",d:2.7},
  {t:"rose",x:105,y:-145,s:25,c:"peach",d:2.95},
  {t:"anemone",x:-165,y:-270,s:21,c:"ivory",d:3.2},
  {t:"tulip",x:20,y:-385,s:24,c:"lavender",d:1.85},
  {t:"peony",x:-105,y:-140,s:26,c:"rose",d:2.6},
  {t:"hydrangea",x:-165,y:-115,s:24,c:"blue",d:2.0},
  {t:"hydrangea",x:155,y:-115,s:24,c:"lavender",d:2.3},
  {t:"hydrangea",x:65,y:-385,s:20,c:"ivory",d:2.5}
];

function resize(){
  W=innerWidth;
  H=innerHeight;
  D=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*D);
  canvas.height=Math.round(H*D);
  ctx.setTransform(D,0,0,D,0,0);

  S=Math.min(W/550,H/800,1.18);
  cx=W/2;
  cy=H*.75;

  stars=Array.from({length:110},()=>({
    x:rand(0,W),y:rand(0,H),
    r:rand(.35,1.4),p:rand(0,TAU)
  }));

  fireflies=Array.from({length:32},()=>({
    x:rand(0,W),y:rand(H*.15,H*.9),
    p:rand(0,TAU),v:rand(.3,1)
  }));
}

function oval(x,y,rx,ry,color,rotation=0){
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,rotation,0,TAU);
  ctx.fillStyle=color;
  ctx.fill();
}

function background(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a1020");
  g.addColorStop(.58,"#1c2238");
  g.addColorStop(1,"#342e3d");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const halo=ctx.createRadialGradient(
    cx,H*.48,0,cx,H*.48,W*.75
  );
  halo.addColorStop(0,"#f1b4ce28");
  halo.addColorStop(1,"transparent");
  ctx.fillStyle=halo;
  ctx.fillRect(0,0,W,H);

  for(const s of stars){
    ctx.globalAlpha=.2+.5*
      (1+Math.sin(t*.001+s.p))/2;
    oval(s.x,s.y,s.r,s.r,"#fff7ed");
  }
  ctx.globalAlpha=1;
}

function leaf(x,y,angle,size,growth=1){
  if(growth<=0)return;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(growth,growth);

  const g=ctx.createLinearGradient(0,-size,0,size);
  g.addColorStop(0,"#b6d0b5");
  g.addColorStop(1,"#4d7c65");

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(
    size*.5,-size*.9,
    size*1.5,-size*.6,
    size*1.8,0
  );
  ctx.bezierCurveTo(
    size*1.2,size*.5,
    size*.35,size*.35,
    0,0
  );
  ctx.fillStyle=g;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(size*1.65,0);
  ctx.strokeStyle="#e0efdc77";
  ctx.lineWidth=.8;
  ctx.stroke();

  ctx.restore();
}

function eucalyptus(x,y,angle,scaleFactor=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scaleFactor,scaleFactor);

  ctx.strokeStyle="#779b88";
  ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(0,35);
  ctx.quadraticCurveTo(5,-20,0,-100);
  ctx.stroke();

  for(let i=0;i<7;i++){
    const yy=15-i*17;
    const side=i%2?-1:1;
    oval(
      side*(12+i*.5),yy,
      15-i*.6,10-i*.3,
      i%2?"#8fae9e":"#a7c2b1",
      side*.3
    );
  }
  ctx.restore();
}

function stem(f,g){
  if(g<=0)return;
  ctx.beginPath();
  ctx.moveTo(0,90);
  ctx.quadraticCurveTo(
    f.x*.35,-55*g,
    f.x*g,f.y*g
  );
  ctx.strokeStyle="#638d72";
  ctx.lineWidth=3;
  ctx.lineCap="round";
  ctx.stroke();

  const l=ease((g-.35)/.65);
  leaf(f.x*.3,f.y*.3,-2.6,20,l);
  leaf(f.x*.55,f.y*.55,-.45,18,l);
}

function petal(length,width,c,curve=1){
  const g=ctx.createLinearGradient(0,0,0,-length);
  g.addColorStop(0,c[3]);
  g.addColorStop(.28,c[2]);
  g.addColorStop(.68,c[1]);
  g.addColorStop(1,c[0]);

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(
    -width,-length*.18,
    -width*curve,-length*.78,
    0,-length
  );
  ctx.bezierCurveTo(
    width*curve,-length*.78,
    width,-length*.18,
    0,0
  );
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle="#ffffff66";
  ctx.lineWidth=.55;
  ctx.stroke();

  // Fine central petal vein.
  ctx.beginPath();
  ctx.moveTo(0,-length*.12);
  ctx.quadraticCurveTo(
    -width*.1,-length*.55,
    0,-length*.9
  );
  ctx.strokeStyle="#ffffff25";
  ctx.lineWidth=.5;
  ctx.stroke();
}

function peony(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  const rings=[
    [13,1.45,.56,1],
    [11,1.28,.52,.78],
    [9,1.12,.49,.55],
    [7,.92,.45,.35],
    [5,.7,.4,.2]
  ];

  rings.forEach((r,k)=>{
    for(let i=0;i<r[0];i++){
      ctx.save();
      ctx.rotate(i*TAU/r[0]+k*.25);
      ctx.translate(0,-s*r[3]*.3);
      petal(s*r[1],s*r[2],c,1.15);
      ctx.restore();
    }
  });

  oval(0,0,s*.14,s*.14,c[3]);
  ctx.restore();
}

function rose(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  for(let ring=0;ring<4;ring++){
    const n=11-ring*2;
    const sc=1-ring*.2;
    for(let i=0;i<n;i++){
      ctx.save();
      ctx.rotate(i*TAU/n+ring*.33);
      ctx.scale(sc,sc);
      petal(s*1.55,s*.53,c);
      ctx.restore();
    }
  }

  ctx.beginPath();
  ctx.arc(0,0,s*.17,.2,TAU*.9);
  ctx.strokeStyle=c[3];
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}

function ranunculus(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  for(let ring=0;ring<6;ring++){
    const n=13-ring;
    const sc=1-ring*.135;
    for(let i=0;i<n;i++){
      ctx.save();
      ctx.rotate(i*TAU/n+ring*.18);
      ctx.scale(sc,sc);
      petal(s*1.25,s*.37,c,1.05);
      ctx.restore();
    }
  }

  oval(0,0,s*.13,s*.13,c[3]);
  ctx.restore();
}

function anemone(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  for(let i=0;i<9;i++){
    ctx.save();
    ctx.rotate(i*TAU/9);
    petal(s*1.5,s*.43,c);
    ctx.restore();
  }

  oval(0,0,s*.45,s*.45,"#30283f");
  oval(0,0,s*.3,s*.3,"#4b3658");

  for(let i=0;i<22;i++){
    const a=i*TAU/22;
    const r=s*.38;
    oval(
      Math.cos(a)*r,
      Math.sin(a)*r,
      1.5,1.5,"#e8d4a1"
    );
  }
  ctx.restore();
}

function tulip(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  for(let i=-1;i<=1;i++){
    ctx.save();
    ctx.rotate(i*(.1+b*.48));
    ctx.scale(.9,1.08);
    petal(s*1.8,s*.6,c);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(-s*.52,-s*.6);
  ctx.quadraticCurveTo(0,-s*.18,s*.52,-s*.6);
  ctx.quadraticCurveTo(s*.3,s*.45,0,s*.5);
  ctx.quadraticCurveTo(-s*.3,s*.45,-s*.52,-s*.6);
  ctx.fillStyle=c[1];
  ctx.fill();
  ctx.restore();
}

function hydrangea(f,b){
  const s=f.s,c=palettes[f.c];
  ctx.save();
  ctx.scale(b,b);

  for(let j=0;j<13;j++){
    const a=j*2.399;
    const r=Math.sqrt(j/13)*s*1.3;
    const x=Math.cos(a)*r;
    const y=Math.sin(a)*r;

    ctx.save();
    ctx.translate(x,y);
    ctx.scale(.38,.38);

    for(let i=0;i<4;i++){
      ctx.save();
      ctx.rotate(i*TAU/4);
      petal(s*.85,s*.35,c);
      ctx.restore();
    }

    oval(0,0,s*.12,s*.12,"#f5e5bd");
    ctx.restore();
  }
  ctx.restore();
}

function babyBreath(elapsed){
  const b=ease((elapsed-1.5)/2);
  if(!b)return;

  const spots=[
    [-195,-310],[-145,-380],[-60,-405],
    [100,-410],[190,-340],[205,-250],
    [-200,-160],[185,-120],[0,-425]
  ];

  ctx.save();
  ctx.globalAlpha=b;

  for(const [x,y] of spots){
    for(let i=0;i<7;i++){
      const a=i*TAU/7;
      const px=x+Math.cos(a)*20;
      const py=y+Math.sin(a)*20;

      ctx.beginPath();
      ctx.moveTo(x,y+14);
      ctx.lineTo(px,py);
      ctx.strokeStyle="#8bad93";
      ctx.lineWidth=.85;
      ctx.stroke();

      oval(px,py,3.2,3.2,"#fffdf6");
      oval(px-1,py-1,1,1,"#ffffff");
    }
  }
  ctx.restore();
}

function wrapping(elapsed){
  const p=ease((elapsed-3.7)/1.4);
  if(!p)return;

  ctx.save();
  ctx.globalAlpha=p;

  // Outer paper folds.
  ctx.fillStyle="#e8d1c6";
  ctx.beginPath();
  ctx.moveTo(-155,-70);
  ctx.lineTo(-180,-160);
  ctx.lineTo(-75,-105);
  ctx.lineTo(0,100);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#f4e2d6";
  ctx.beginPath();
  ctx.moveTo(155,-70);
  ctx.lineTo(180,-160);
  ctx.lineTo(75,-105);
  ctx.lineTo(0,100);
  ctx.closePath();
  ctx.fill();

  // Inner translucent tissue.
  ctx.fillStyle="#fff7efaa";
  ctx.beginPath();
  ctx.moveTo(-135,-65);
  ctx.lineTo(-155,-125);
  ctx.lineTo(0,90);
  ctx.lineTo(155,-125);
  ctx.lineTo(135,-65);
  ctx.lineTo(0,120);
  ctx.closePath();
  ctx.fill();

  // Main champagne paper.
  const g=ctx.createLinearGradient(
    -140,-70,140,120
  );
  g.addColorStop(0,"#f8e9df");
  g.addColorStop(.45,"#d9b9ae");
  g.addColorStop(1,"#f7e7db");

  ctx.beginPath();
  ctx.moveTo(-155,-75);
  ctx.lineTo(-110,-50);
  ctx.lineTo(0,100);
  ctx.lineTo(110,-50);
  ctx.lineTo(155,-75);
  ctx.lineTo(100,50);
  ctx.lineTo(0,135);
  ctx.lineTo(-100,50);
  ctx.closePath();
  ctx.fillStyle=g;
  ctx.fill();

  ctx.strokeStyle="#b88f8655";
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(-110,-50);
  ctx.lineTo(0,100);
  ctx.lineTo(110,-50);
  ctx.stroke();

  ctx.restore();
}

function ribbon(elapsed){
  const p=ease((elapsed-4.8)/1.2);
  if(!p)return;

  ctx.save();
  ctx.translate(0,66);
  ctx.globalAlpha=p;

  const g=ctx.createLinearGradient(-45,0,45,20);
  g.addColorStop(0,"#a97191");
  g.addColorStop(.45,"#f5d2e1");
  g.addColorStop(1,"#ad7998");
  ctx.fillStyle=g;

  // Satin tails.
  ctx.beginPath();
  ctx.moveTo(-7,5);
  ctx.quadraticCurveTo(-20,48,-35,96);
  ctx.lineTo(-13,82);
  ctx.lineTo(3,9);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(7,5);
  ctx.quadraticCurveTo(23,45,38,92);
  ctx.lineTo(16,78);
  ctx.lineTo(-3,9);
  ctx.fill();

  // Loops.
  for(const side of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(
      side*27,-30,
      side*68,-24,
      side*55,9
    );
    ctx.bezierCurveTo(
      side*36,29,
      side*15,16,
      0,0
    );
    ctx.fill();
  }

  oval(0,5,12,9,"#f6dce7");
  oval(-3,2,4,3,"#fff9f6aa");
  ctx.restore();
}

function bouquet(t){
  const elapsed=(t-start)/1000;
  const sway=Math.sin(t*.00065)*.015;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(S,S);
  ctx.rotate(sway);

  // Stems.
  for(const f of flowers){
    stem(f,ease((elapsed-f.d)/1.6));
  }

  // Eucalyptus foliage.
  const green=ease((elapsed-.8)/2);
  ctx.globalAlpha=green;

  eucalyptus(-140,-155,-.35,.9);
  eucalyptus(140,-165,.35,.9);
  eucalyptus(-85,-255,-.25,.75);
  eucalyptus(90,-270,.25,.75);

  for(let i=0;i<10;i++){
    const side=i%2?-1:1;
    leaf(
      side*(75+i*11),
      -85-i*24,
      side<0?-2.8:-.3,
      18+(i%3)*5
    );
  }

  ctx.globalAlpha=1;
  babyBreath(elapsed);

  // Individual flower heads.
  for(let i=0;i<flowers.length;i++){
    const f=flowers[i];
    const b=ease((elapsed-f.d-.8)/1.5);
    if(b<=0)continue;

    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(Math.sin(t*.001+i*1.4)*.025);

    const c=palettes[f.c];

    ctx.save();
    ctx.globalAlpha=.1*b;
    ctx.shadowBlur=24;
    ctx.shadowColor=c[1];
    oval(0,0,f.s,f.s,c[0]);
    ctx.restore();

    if(f.t==="peony")peony(f,b);
    if(f.t==="rose")rose(f,b);
    if(f.t==="ranunculus")ranunculus(f,b);
    if(f.t==="anemone")anemone(f,b);
    if(f.t==="tulip")tulip(f,b);
    if(f.t==="hydrangea")hydrangea(f,b);

    ctx.restore();
  }

  wrapping(elapsed);
  ribbon(elapsed);
  ctx.restore();
}

function drawFireflies(t){
  ctx.save();
  ctx.globalCompositeOperation="screen";

  for(const f of fireflies){
    const x=f.x+Math.sin(t*.0005*f.v+f.p)*28;
    const y=f.y+Math.cos(t*.0007*f.v+f.p)*19;
    const a=.2+.65*Math.pow(
      Math.sin(t*.0015+f.p),2
    );

    const g=ctx.createRadialGradient(x,y,0,x,y,15);
    g.addColorStop(0,`rgba(255,237,185,${a})`);
    g.addColorStop(.3,`rgba(255,220,160,${a*.3})`);
    g.addColorStop(1,"transparent");
    oval(x,y,15,15,g);
  }
  ctx.restore();
}

function burst(x,y){
  const palette=[
    "#f5b0ca","#e3c9ff",
    "#fff4e5","#f7c9b6"
  ];

  for(let i=0;i<30;i++){
    const a=rand(0,TAU);
    const v=rand(40,135);
    particles.push({
      x,y,vx:Math.cos(a)*v,
      vy:Math.sin(a)*v-20,
      life:rand(.8,1.6),
      size:rand(1.5,4),
      rot:rand(0,TAU),
      spin:rand(-3,3),
      color:palette[Math.floor(rand(0,4))]
    });
  }
}

function shootingStar(x,y){
  const a=-Math.PI/4+rand(-.2,.2);
  const v=rand(650,950);

  meteors.push({
    x,y,
    vx:Math.cos(a)*v,
    vy:Math.sin(a)*v,
    life:.85,
    trail:[]
  });
}

function drawMeteors(dt){
  for(let i=meteors.length-1;i>=0;i--){
    const s=meteors[i];
    s.x+=s.vx*dt;
    s.y+=s.vy*dt;
    s.life-=dt;

    s.trail.push({x:s.x,y:s.y});
    if(s.trail.length>32)s.trail.shift();

    ctx.save();
    ctx.globalCompositeOperation="screen";

    for(let j=1;j<s.trail.length;j++){
      const a=s.trail[j-1];
      const b=s.trail[j];
      const alpha=(j/s.trail.length)*
        clamp(s.life*1.5,0,1);

      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(255,220,245,${alpha})`;
      ctx.lineWidth=j/s.trail.length*5;
      ctx.lineCap="round";
      ctx.shadowBlur=12;
      ctx.shadowColor="#ffc5ec";
      ctx.stroke();
    }

    if(s.life>0){
      ctx.beginPath();
      ctx.arc(s.x,s.y,4,0,TAU);
      ctx.fillStyle="#fffaf5";
      ctx.shadowBlur=25;
      ctx.shadowColor="#ffffff";
      ctx.fill();
    }
    ctx.restore();

    if(s.life<=0){
      burst(s.x,s.y);
      meteors.splice(i,1);
    }
  }
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=28*dt;
    p.rot+=p.spin*dt;
    p.life-=dt;

    if(p.life<=0){
      particles.splice(i,1);
      continue;
    }

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha=clamp(p.life,0,1);
    oval(0,0,p.size,p.size*.5,p.color);
    ctx.restore();
  }
}

function animate(t){
  const dt=Math.min((t-(last||t))/1000,.05);
  last=t;

  background(t);
  bouquet(t);
  drawFireflies(t);
  drawMeteors(dt);
  drawParticles(dt);

  requestAnimationFrame(animate);
}

canvas.addEventListener("pointerdown",e=>{
  shootingStar(e.clientX,e.clientY);
});

window.addEventListener("resize",resize);

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
